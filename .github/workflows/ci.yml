name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keyed by pull request when there is one: github.ref is per-branch, so every
# push to a branch-backed review opened a fresh group and the previous
# 30-minute macOS matrix kept running instead of being cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS 15, Swift 6)
    # Self-hosted macOS lane, repo-scoped. This repository is PUBLIC and every org
    # runner group declares allows_public_repositories: false, so no group can
    # admit it — the runner is therefore attached to THIS repository
    # (`disablescreen-ci-1`), which is the pattern already proven on
    # benjaminbelaga/comux. The org's shared Mac stays in its 2026-10-05
    # quarantine group untouched, so the containment proof still holds.
    #
    # Fork PRs are the risk of a self-hosted runner on a public repo: their code
    # runs arbitrary scripts on this host. Mitigated outside this file by setting
    # fork_pr_contributor_approval to all_external_contributors, so no fork job
    # starts without a maintainer approval. Do not relax that setting.
    runs-on: [self-hosted, macOS, ARM64, disablescreen-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build
        run: swift build --build-tests

      - name: Test
        # `swift test` DOES run this repository's XCTest suites on Swift 6.4.2 /
        # Xcode 27 — verified 2026-11-09 on the real toolchain: 89 + 388 + 40 +
        # 194 + 11 = 722 cases, and a deliberately failing test case makes the
        # command exit 1. The per-bundle `xcrun xctest` loop this replaced was
        # built on a misreading: the toolchain also prints
        #
        #     ✔ Test run with 0 tests in 0 suites passed
        #
        # once per target, because it runs the swift-testing harness as well and
        # this package declares no swift-testing suites. Those lines say nothing
        # about XCTest, which runs fully beside them.
        #
        # The floor stays: it is what catches a future toolchain that silently
        # stops discovering, which is the failure the old loop was really
        # guarding against. A floor below the observed 722 rather than an exact
        # contract, so adding or removing a test does not break CI.
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/swift-test.log"
          # `swift test` already exits non-zero on a failing case; the floor
          # below is the discovery guard. Capture the status separately so the
          # count is always analysed before the step's outcome is decided.
          set +e
          swift test 2>&1 | tee "$out"
          rc=${PIPESTATUS[0]}
          set -e
          # One "Executed N tests" line matters per bundle: the one that follows
          # `Test Suite '<X>Tests.xctest' passed|failed`. Every other such line
          # belongs to an individual suite inside that bundle and must not be
          # summed. Verified against the real toolchain (2026-11-09): 89 + 388 +
          # 40 + 194 + 11 = 722.
          total="$(awk '
            /^Test Suite .*Tests\.xctest. (passed|failed) at/ { want = 1; next }
            want && /Executed [0-9]+ tests/ {
              line = $0
              sub(/.*Executed /, "", line)
              sub(/ tests.*/, "", line)
              sum += line; n++; want = 0
            }
            END { print sum + 0 }
          ' "$out")"
          bundles="$(grep -cE '^Test Suite .*Tests\.xctest. (passed|failed) at' "$out" || true)"
          echo "bundles=$bundles total_tests=$total"
          test "$rc" -eq 0 \
            || { echo "::error::swift test failed (rc=$rc)"; exit "$rc"; }
          test "${total:-0}" -gt 0 \
            || { echo "::error::swift test executed no tests"; exit 1; }
          test "$bundles" -ge 5 \
            || { echo "::error::only $bundles test bundles ran, expected 5"; exit 1; }
          test "$total" -ge 700 \
            || { echo "::error::only $total tests ran, expected at least 700"; exit 1; }

      - name: Assemble app bundle (ad-hoc signed)
        run: bash scripts/build-runclosed-app.sh

      - name: Verify bundle signature
        run: codesign --verify --strict build/RunClosed.app

      - name: Smoke — CLI answers and usage is honest
        run: |
          set -euo pipefail
          CLI=build/RunClosed.app/Contents/MacOS/runclosed-cli
          "$CLI" status --json || "$CLI" status
          "$CLI" lid-stay-awake status
          # ADR 023: the session record is readable without mutating anything
          "$CLI" session status --json
          # unknown subcommand must exit 64, not 0
          set +e
          "$CLI" definitely-not-a-command >/dev/null 2>&1
          rc=$?
          # an unusable duration is a usage error too
          "$CLI" session start --for nonsense >/dev/null 2>&1
          rc2=$?
          set -e
          test "$rc" -eq 64
          test "$rc2" -eq 64
