name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keyed by pull request when there is one: github.ref is per-branch, so every
# push to a branch-backed review opened a fresh group and the previous
# 30-minute macOS matrix kept running instead of being cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS 15, Swift 6)
    # Self-hosted macOS lane, repo-scoped. This repository is PUBLIC and every org
    # runner group declares allows_public_repositories: false, so no group can
    # admit it — the runner is therefore attached to THIS repository
    # (`disablescreen-ci-1`), which is the pattern already proven on
    # benjaminbelaga/comux. The org's shared Mac stays in its 2026-10-05
    # quarantine group untouched, so the containment proof still holds.
    #
    # Fork PRs are the risk of a self-hosted runner on a public repo: their code
    # runs arbitrary scripts on this host. Mitigated outside this file by setting
    # fork_pr_contributor_approval to all_external_contributors, so no fork job
    # starts without a maintainer approval. Do not relax that setting.
    runs-on: [self-hosted, macOS, ARM64, disablescreen-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build
        run: swift build --build-tests

      - name: Test
        # `swift test` discovers ZERO of this repository's tests on the
        # Swift 6.4.2 / Xcode 27 toolchain: it reports
        # "Test run with 0 tests in 0 suites passed" while 329 XCTest methods
        # exist across five bundles. That is a green check proving nothing —
        # the migration to a self-hosted Mac must not inherit it.
        #
        # Each bundle is therefore executed explicitly through `xcrun xctest`,
        # which discovers and runs them correctly (verified locally: 106 + 153 +
        # 46 + 13 + 11 = 329 tests, 0 failures). The per-bundle count is asserted
        # so a future toolchain that silently stops discovering tests fails the
        # job instead of passing it quietly.
        run: |
          set -euo pipefail
          total=0
          for bundle in .build/debug/*Tests.xctest; do
            # Write the transcript to a file first. Piping it into `grep -q`
            # makes grep exit on first match and close the pipe, so the writing
            # `printf` dies with EPIPE — and under `pipefail` that aborts the
            # step even though the assertion itself passed. (Live failure,
            # 2026-11-08: "printf: Broken pipe" failed a bundle that reported
            # 283 tests with 0 failures.)
            out="$RUNNER_TEMP/$(basename "$bundle").log"
            xcrun xctest "$bundle" >"$out" 2>&1
            tail -3 "$out"
            n="$(grep -oE 'Executed [0-9]+ tests, with [0-9]+ failures' "$out" \
                 | tail -1 | grep -oE '[0-9]+' | head -1)"
            # A bundle that ran nothing is a failure, not a pass.
            test -n "${n:-}" && test "$n" -gt 0 \
              || { echo "::error::$bundle executed no tests"; exit 1; }
            grep -qE 'with 0 failures' "$out" \
              || { echo "::error::$bundle reported failures"; exit 1; }
            total=$((total + n))
          done
          echo "total tests executed: $total"
          # Belt-and-braces floor. The per-bundle `n -gt 0` assertion above is
          # the real guard (it is what catches the "swift test discovers 0"
          # regression); this only catches a partial discovery. Deliberately a
          # floor below the observed 329 rather than an exact contract, so adding
          # or removing a test does not break CI.
          test "$total" -ge 300 \
            || { echo "::error::only $total tests ran, expected at least 300"; exit 1; }

      - name: Assemble app bundle (ad-hoc signed)
        run: bash scripts/build-runclosed-app.sh

      - name: Verify bundle signature
        run: codesign --verify --strict build/RunClosed.app

      - name: Smoke — CLI answers and usage is honest
        run: |
          set -euo pipefail
          CLI=build/RunClosed.app/Contents/MacOS/runclosed-cli
          "$CLI" status --json || "$CLI" status
          "$CLI" lid-stay-awake status
          # ADR 023: the session record is readable without mutating anything
          "$CLI" session status --json
          # unknown subcommand must exit 64, not 0
          set +e
          "$CLI" definitely-not-a-command >/dev/null 2>&1
          rc=$?
          # an unusable duration is a usage error too
          "$CLI" session start --for nonsense >/dev/null 2>&1
          rc2=$?
          set -e
          test "$rc" -eq 64
          test "$rc2" -eq 64
