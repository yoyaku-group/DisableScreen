name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

# One scan per pull request, not one per push: a branch-backed review keeps
# pushing and each push used to start a second full-history scan alongside the
# one its pull_request event had already triggered.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    # Same repo-scoped self-hosted lane as ci.yml: `ubuntu-latest` was the last
    # hosted runner in this repository and billed per minute. gitleaks is MIT and
    # ships a darwin/arm64 build, so the scan costs nothing here.
    runs-on: [self-hosted, macOS, ARM64, disablescreen-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid license key for
      # organizations; the CLI itself is MIT and needs none. Run the pinned
      # binary directly so a fork or an org repo both work without secrets.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_darwin_arm64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
