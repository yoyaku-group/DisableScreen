name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid license key for
      # organizations; the CLI itself is MIT and needs none. Run the pinned
      # binary directly so a fork or an org repo both work without secrets.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
