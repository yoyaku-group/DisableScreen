name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

# One scan per pull request, not one per push: a branch-backed review keeps
# pushing and each push used to start a second full-history scan alongside the
# one its pull_request event had already triggered.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    # Same repo-scoped self-hosted lane as ci.yml: `ubuntu-latest` was the last
    # hosted runner in this repository and billed per minute. gitleaks is MIT and
    # ships a darwin/arm64 build, so the scan costs nothing here.
    runs-on: [self-hosted, macOS, ARM64, disablescreen-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid license key for
      # organizations; the CLI itself is MIT and needs none. Run the pinned
      # binary directly so a fork or an org repo both work without secrets.
      # Downloaded into `$RUNNER_TEMP`, not the checkout, and verified against
      # the release's own checksum file first. Both matter more here than they
      # would on a hosted VM: this runner is PERSISTENT, so a stale `./gitleaks`
      # from an earlier run would be reused if the download failed partway, and
      # a tampered or intercepted tarball would install a trojaned binary that
      # survives between jobs. The scan below reads the checkout; nothing else
      # needs to write there.
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          TARBALL="gitleaks_${VERSION}_darwin_arm64.tar.gz"
          SHA256=d942f3ad147250c9edbaab3fed9e482f98d3b59ba10ae97b8d75647e3ade492c
          DEST="$RUNNER_TEMP/gitleaks-${VERSION}"
          rm -rf "$DEST"; mkdir -p "$DEST"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}" \
            -o "$DEST/$TARBALL"
          echo "${SHA256}  ${DEST}/${TARBALL}" | shasum -a 256 -c -
          tar -xzf "$DEST/$TARBALL" -C "$DEST" gitleaks
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/gitleaks" version

      - name: Scan the full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
