# gitleaks configuration — RunClosed
#
# The repo contains NO secrets. This config exists to keep the scan focused:
# the legacy audit notes and README legitimately mention a sudoers rule that
# whitelists `pmset`, which generic rules may flag as a "password-less root"
# pattern. Everything else follows the default ruleset.

title = "RunClosed"
[extend]
useDefault = true

[allowlist]
description = "Documented sudoers whitelist and test fixtures"
paths = [
  '''README\.md$''',
  '''PROGRESS\.md$''',
  '''TEST_RESULTS\.md$''',
  '''DECISIONS\.md$''',
  '''docs/.*\.md$''',
  '''evidence/.*\.md$''',
  '''scripts/hardware/.*\.sh$''',
]
regexes = [
  '''NOPASSWD,''',
  '''disablesleep''',
]
